# ============================================================================
# 🚀 Release + Publish Pipeline
# ============================================================================
# Chain: CI → Release → TestPyPI → PyPI (approval) → Homebrew
#
# Automatically creates releases based on conventional commit messages,
# publishes to PyPI, and updates Homebrew tap.
#
# Reusable actions from: fulviofreitas/workflow-arsenal/.github/actions/
# ============================================================================

name: 🚀 Release

on:
  # Trigger after CI workflow completes successfully.
  # Reviewed: `branches` matches the head branch NAME only (a fork PR from a
  # branch called master passes it), so the release job also requires a push
  # event from this repository before it touches the App token.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["🧪 CI Pipeline"]
    types: [completed]
    branches: [master]
  # Allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 Dry-run mode (no actual release)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

# Deny by default; each job grants only what it needs. Repository writes
# (tag, release commit, release notes, comments) go through the App token,
# not GITHUB_TOKEN. id-token stays scoped to the environment-bound publish jobs.
permissions: {}

jobs:
  # ============================================================================
  # 🚀 Semantic Release
  # ============================================================================
  release:
    name: 🚀 Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run if CI passed on a push to this repo (or manual trigger) and
    # not a release commit
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
       !contains(github.event.workflow_run.head_commit.message, 'chore(release)'))

    permissions:
      contents: read

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # semantic-release: push tag + release commit, create the release
          # (contents), comment on / label released issues and PRs.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: 🚀 Run semantic-release
        id: release
        uses: fulviofreitas/workflow-arsenal/.github/actions/semantic-release@2087aa01c13f842fc566101ceeb9a4a49ec2a370 # master
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}

  # ============================================================================
  # 📦 Publish to TestPyPI (validation step)
  # ============================================================================
  publish-testpypi:
    name: 📦 Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: release
    if: |
      success() &&
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.version != '' &&
      github.event.inputs.dry_run != 'true'
    timeout-minutes: 10

    environment:
      name: testpypi
      url: https://test.pypi.org/project/eeroctl/

    permissions:
      id-token: write  # Required for Trusted Publishing
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: 🏷️ Create dev version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          DEV_VERSION="${RELEASE_VERSION}.dev0"
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

          # Update pyproject.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"${DEV_VERSION}\"/" pyproject.toml

          # Update __init__.py
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"${DEV_VERSION}\"/" src/eeroctl/__init__.py

          echo "📦 TestPyPI version: ${DEV_VERSION}"

      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: 🏗️ Build package
        run: python -m build

      - name: 🔍 Validate package
        run: twine check dist/*

      - name: 📤 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false
          verbose: true

  # ============================================================================
  # 📦 Publish to PyPI (requires approval)
  # ============================================================================
  publish-pypi:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release, publish-testpypi]
    if: |
      success() &&
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.version != '' &&
      github.event.inputs.dry_run != 'true'
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/project/eeroctl/

    permissions:
      id-token: write  # Required for Trusted Publishing
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: 🏗️ Build package
        run: python -m build

      - name: 🔍 Validate package
        run: twine check dist/*

      - name: 📤 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: false
          verbose: true

  # ============================================================================
  # 🍺 Update Homebrew Tap
  # ============================================================================
  update-homebrew:
    name: 🍺 Update Homebrew
    runs-on: ubuntu-latest
    needs: [release, publish-pypi]
    if: |
      success() &&
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.version != '' &&
      github.event.inputs.dry_run != 'true'
    timeout-minutes: 5
    # Only the App token (scoped to homebrew-eeroctl) is used here.
    permissions: {}

    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: fulviofreitas
          repositories: homebrew-eeroctl
          # repository_dispatch requires contents: write on the target repo.
          permission-contents: write

      - name: 🍺 Trigger formula update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: fulviofreitas/homebrew-eeroctl
          event-type: update-formula
          client-payload: |
            {
              "version": "${{ needs.release.outputs.version }}",
              "package": "eeroctl"
            }

      - name: 📝 Summary
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🍺 Homebrew Update Triggered

          | Property | Value |
          |:---------|:------|
          | 📦 Package | \`eeroctl\` |
          | 🏷️ Version | \`v${RELEASE_VERSION}\` |
          | 🎯 Repository | \`fulviofreitas/homebrew-eeroctl\` |

          The Homebrew tap will be updated automatically.

          ### 📥 Installation

          \`\`\`bash
          brew install fulviofreitas/eeroctl/eeroctl
          \`\`\`
          EOF
