# ============================================================================
# 🔄 Renovate - Automated Dependency Updates
# ============================================================================
# Runs Renovate to check for dependency updates and create PRs.
# Uses the reusable renovate action from eero-api.
#
# Key features:
# - Tracks eero-api dependency via repository_dispatch
# - Auto-merges minor/patch updates for most dependencies
# - Requires manual review for major updates
# - Repository caching for faster subsequent runs
#
# Triggers:
# - Scheduled: Every 6 hours (4 times daily)
# - Manual: workflow_dispatch
# - On eero-api release: repository_dispatch
# ============================================================================

name: 🔄 Renovate

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 Dry-run mode (no PRs created)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      log_level:
        description: "📝 Log level"
        required: false
        default: "info"
        type: choice
        options:
          - "debug"
          - "info"
          - "warn"
      reset_cache:
        description: "🗑️ Reset repository cache"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  repository_dispatch:
    types: [eero-api-dependency-update-available]

# Prevent concurrent runs
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # 🔄 Run Renovate
  # ============================================================================
  renovate:
    name: 🔄 Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📋 Log trigger info
        # client_payload comes from another repo's repository_dispatch; pass it
        # through env: so the shell treats it as data, never as script text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
          PAYLOAD_PACKAGE: ${{ github.event.client_payload.package || 'eero-api' }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          PAYLOAD_TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || 'unknown' }}
        run: |
          echo "🎯 Trigger: ${EVENT_NAME}"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "🔗 Source: ${PAYLOAD_REPOSITORY}"
            echo "📦 Package: ${PAYLOAD_PACKAGE}"
            echo "🏷️ Version: ${PAYLOAD_VERSION}"
            echo "🔖 Tag: ${PAYLOAD_TAG}"
            echo "👤 Triggered by: ${PAYLOAD_TRIGGERED_BY}"
          fi

      # ========================================================================
      # ⏳ Wait for PyPI Indexing
      # ========================================================================
      # PyPI indexing typically takes 1-5 minutes after package upload.
      # This step polls PyPI until the new version is available.
      - name: ⏳ Wait for PyPI indexing
        if: github.event_name == 'repository_dispatch'
        uses: fulviofreitas/workflow-arsenal/.github/actions/wait-for-pypi@7fcefdc57681a54229f0ae2c846f13d47e436e19 # v1.0.0
        with:
          package: ${{ github.event.client_payload.package || 'eero-api' }}
          version: ${{ github.event.client_payload.version }}

      # ========================================================================
      # 🔄 Run Renovate
      # ========================================================================
      - name: 🔄 Run Renovate
        uses: fulviofreitas/workflow-arsenal/.github/actions/renovate@7fcefdc57681a54229f0ae2c846f13d47e436e19 # v1.0.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          config-file: ".github/renovate.json5"
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
          log-level: ${{ github.event.inputs.log_level || 'info' }}
          reset-cache: ${{ github.event.inputs.reset_cache || 'false' }}

      # ========================================================================
      # 📝 Summary
      # ========================================================================
      - name: 📝 Generate summary
        if: always()
        # Pass every GitHub-context value through env: so it is expanded by the
        # shell as data, never interpolated into the script text.
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
          PAYLOAD_PACKAGE: ${{ github.event.client_payload.package || 'eero-api' }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version || 'unknown' }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag || 'unknown' }}
          PAYLOAD_TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || 'unknown' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🔄 Renovate Summary

          | Property | Value |
          |:---------|:------|
          | 📦 Repository | [\`${REPOSITORY}\`](https://github.com/${REPOSITORY}) |
          | 🎯 Trigger | \`${EVENT_NAME}\` |
          | 🧪 Dry Run | \`${DRY_RUN}\` |

          EOF

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ### 📦 Triggered by Dependency Release

          | Property | Value |
          |:---------|:------|
          | 🔗 Source | [\`${PAYLOAD_REPOSITORY:-unknown}\`](https://github.com/${PAYLOAD_REPOSITORY}) |
          | 📦 Package | \`${PAYLOAD_PACKAGE}\` |
          | 🏷️ Version | \`${PAYLOAD_VERSION}\` |
          | 🔖 Tag | \`${PAYLOAD_TAG}\` |
          | 👤 Triggered by | \`${PAYLOAD_TRIGGERED_BY}\` |

          EOF
          fi
